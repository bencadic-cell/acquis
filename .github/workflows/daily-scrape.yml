name: Deal Flow Daily Scraper

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape MA platforms
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        run: python acquis-bot/scraper/scraper.py

      - name: Commit updated deals.json
        run: |
          git config --local user.email "acquis-bot@users.noreply.github.com"
          git config --local user.name "Acquis Bot"
          git add deals.json
          if git diff --staged --quiet; then
            echo "No new deals found"
          else
            git commit -m "Deal flow $(date +%Y-%m-%d)"
            git push
          fi
